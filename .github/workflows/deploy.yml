name: Deploy Site

on:
  workflow_run:
    workflows:
      - "CI: push-quality"
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_site:
        description: 'Deploy site'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy-site:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_site) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site hosting bundle
        run: pnpm deploy:build:site

      - name: Deploy Firebase site target
        run: npx firebase-tools@latest deploy --only hosting:site --token "${{ secrets.FIREBASE_TOKEN }}"
