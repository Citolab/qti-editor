name: Update docs
on:
  workflow_run:
    workflows:
      - "CI: push-quality"
    types:
      - completed
  workflow_dispatch: {}

jobs:
  update-docs:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Detect package changes
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(git rev-parse "${{ github.event.workflow_run.head_sha }}^" 2>/dev/null || true)"
          if [[ -z "$base_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base_sha" "${{ github.event.workflow_run.head_sha }}" | grep -q '^packages/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Azure
        if: ${{ steps.filter.outputs.changed == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: anthropics/claude-code-action@v1
        if: ${{ steps.filter.outputs.changed == 'true' }}
        with:
          use_foundry: "true"
          show_full_output: "true"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*)"
          prompt: |
            Code in packages changed. Update the docs to match, then create a
            new branch, commit, push, and open a pull request against main with
            `gh pr create` describing what changed and why.

            The two doc trees have different audiences and are not
            interchangeable:

            - apps/site/src/content/docs is the PUBLISHED site, for people USING
              the editor. Interactions, the item format, getting started.
            - /docs is for people WORKING ON this repo. The Node API
              (docs/node-api.md), testing findings, sync playbooks. Do NOT
              promote any of it onto the site.

            Two rules that have been broken before:

            - Every Starlight sidebar entry in apps/site/astro.config.mjs must
              resolve to a page that exists. Deleting a page without removing its
              sidebar entry fails the site build outright, and CI now builds the
              site, so it fails the PR.
            - Check main before documenting an API. Do not reintroduce
              `ensureInteractionPrompts` (deleted; qti-prompt is optional now) or
              qti-associate-interaction (removed from the editor entirely).

            Keep one PR per run and rebase rather than stacking: several stale
            docs PRs conflicting with each other is what prompted this note.
        env:
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.AZURE_FOUNDRY_RESOURCE }}
          GH_TOKEN: ${{ github.token }}