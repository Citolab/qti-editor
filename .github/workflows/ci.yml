name: "CI: push-quality"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI from'
        required: false
        default: 'main'
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint:check

      # Runs before the (slow) Playwright install so it fails fast.
      # Must stay after "Build packages": prose-qti resolves prose-extensions
      # through its project reference output.
      - name: Typecheck
        run: pnpm typecheck

      # No separate "Schema drift check" step any more. It is now a browser test
      # (schema/content-model.browser.test.ts) and so runs under "Run tests" below.
      #
      # It could not stay here even if we wanted it: this position is before the Playwright
      # install, and the check needs a browser now. It needs one because building the real editor
      # schema imports the real components, which are built for a bundler — as a plain tsx script
      # it died on a Vite-only stylesheet specifier in a dependency's dist, and it had never once
      # run green in CI because Typecheck failed ahead of it every time and nobody saw the step
      # underneath.

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run tests
        run: |
          echo "## Vitest (Storybook + Browser)" >> $GITHUB_STEP_SUMMARY
          pnpm test

      - name: Build Storybook
        run: pnpm build-storybook
