name: "CI: push-quality"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run CI from'
        required: false
        default: 'main'
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint:check

      # Runs before the (slow) Playwright install so it fails fast.
      # Must stay after "Build packages": prose-qti resolves prose-extensions
      # through its project reference output.
      - name: Typecheck
        run: pnpm typecheck

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run tests
        run: |
          echo "## Vitest (Storybook + Browser)" >> $GITHUB_STEP_SUMMARY
          pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      # The site was the one buildable artifact CI did not build, and it broke on main because of
      # that: removing qti-associate-interaction deleted its docs page but left the Starlight sidebar
      # pointing at the slug, which is a build error and nothing else. Both PRs went green, main went
      # red, and the failure surfaced in the deploy workflow well after the merge.
      #
      # `astro check && astro build` over 26 pages costs ~11s on top of an install that has already
      # happened, so there is no reason for this to be a post-merge discovery.
      - name: Build site
        run: pnpm --filter @qti-editor/site run build
