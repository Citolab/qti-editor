# Mirrors qti-components' release lane: changesets accumulate on main, and a human decides when
# the set is worth a release. Nothing publishes on merge.
#
# The FILENAME is load-bearing and must stay `release.yml`: npm trusted publishing binds a
# package to a repository plus a workflow filename, and the OIDC exchange is rejected if the
# publish comes from anywhere else. Renaming this file silently breaks publishing for all three
# packages. The `name:` below is cosmetic by comparison and matches qti-components so the two
# repos read the same in the Actions sidebar.
name: "Manual: release and publish packages (changesets)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Dry-run (no commits, tags, or publishes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm >= 11.5.1: the OIDC token exchange that authenticates the
      # publish lives in the npm CLI, not in pnpm. `pnpm publish` on pnpm 10 delegates to npm, so
      # this is the CLI that actually talks to the registry, and a too-old npm fails as an auth
      # error rather than as a version error.
      #
      # NOTE: pnpm 11 implements `publish` natively and no longer delegates. When this repo moves
      # to pnpm 11, tools/publish-if-needed.mjs must call `npm publish` directly or the OIDC
      # exchange disappears with the delegation.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # qti-components runs `changeset:check-umbrella` here. It is deliberately absent:
      # that gate exists because its umbrella reaches every workspace package through
      # devDependencies, which Changesets hard-codes to produce no dependent bump. In this
      # repo @citolab/prose-qti depends on @citolab/prose-extensions through `dependencies`
      # (`workspace:*`), which Changesets bumps natively. See .changeset/README.md.

      - name: Dry-run release status
        if: ${{ inputs.dry_run }}
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            pnpm run changeset:status
          else
            echo "No pending changesets."
          fi

      - name: Dry-run version preview (snapshot)
        if: ${{ inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API,
          # so the preview needs the same token the real version step uses.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md >/dev/null 2>&1; then
            exit 0
          fi

          pnpm exec changeset version --snapshot dryrun

          echo "Preview of version/changelog changes:"
          git --no-pager diff -- .changeset packages || true

          # Revert preview mutations; dry-run should not leave repository changes behind.
          git checkout -- .changeset packages

      - name: Apply changeset versions
        id: version
        if: ${{ !inputs.dry_run }}
        env:
          # @changesets/changelog-github resolves PR and author links through the API.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run changeset:version

          # Keep the committed custom-elements manifest aligned with versioned sources.
          pnpm run cem

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets. Nothing to release."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit release version updates
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git add .changeset packages custom-elements.json
          git commit -m "chore(release): changesets version [skip ci]"

      - name: Build publishable packages
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        # `build:packages`, not per-package --filter calls, because ORDER MATTERS: prose-qti
        # resolves prose-extensions through a TypeScript project reference, so building it first
        # fails with TS6305. build:packages uses `--sort`, which builds in dependency order — the
        # same script CI runs, so the two cannot drift.
        run: pnpm run build:packages

      - name: Configure npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: |
          # Remove any .npmrc that setup-node created (it contains an _authToken placeholder
          # which overrides OIDC when set to empty/missing)
          rm -f .npmrc "$HOME/.npmrc"

          # Write a clean .npmrc — no _authToken so npm falls back to OIDC
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'provenance=true' > "$HOME/.npmrc"

      # `changeset publish` is deliberately not used, matching qti-components: @changesets/cli
      # 3.0.1 reads `response.info.versions` in getUnpublishedPackages without checking it exists,
      # and its pnpm code path can return a response that has no `versions` array. The step below
      # publishes through tools/publish-if-needed.mjs, which is idempotent and skips versions
      # already on npm, and tags come from `changeset:tag`. This repo is not in changesets
      # pre-release mode, so there are no dist-tags for it to get right.
      - name: Publish packages to npm
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          for var in $(env | grep -oP '^npm_config_\w+' | grep -vE '^npm_config_(registry|provenance|cache|userconfig)$'); do
            unset "$var"
          done
          pnpm run ci:publish:missing
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_GIT_CHECKS: 'false'

      - name: Tag published packages
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: pnpm run changeset:tag

      # Push the commit and the tags as separate refspecs rather than relying on
      # `--follow-tags`. `changeset:tag` writes one annotated tag per package, and pushing them
      # explicitly keeps that independent of whatever tag-following behaviour the commit push
      # happens to have.
      - name: Push release commit and tags
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        run: |
          git push origin HEAD
          git push origin --tags

      # qti-components announces its single umbrella package. This repo publishes three on
      # independent versions, so the release announces @citolab/prose-qti — the package a host
      # actually installs — and the other two are discoverable through their pushed tags.
      - name: Create GitHub release for the flagship package
        if: ${{ !inputs.dry_run && steps.version.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/prose-qti/package.json').version")
          tag="@citolab/prose-qti@${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          notes=$(node tools/changesets/release-notes.mjs packages/prose-qti "$version")
          gh release create "$tag" --title "@citolab/prose-qti ${version}" --notes "$notes"
