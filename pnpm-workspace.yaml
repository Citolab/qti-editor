packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/*"
  - "packages/*/*/*"

# Every @qti-components/* pin, in ONE place.
#
# These are pkg.pr.new prereleases built from qti-components' `editor` branch, pinned by commit
# sha. They are NOT the npm release train — npm's @qti-components/* is a diverged line (theme
# 1.6.0 there vs 1.5.0 here), so a registry range would silently swap out the editor-branch work.
# The pkgr URLs stay until that branch lands on npm.
#
# Consumers write `"@qti-components/theme": "catalog:"`. Syncing to a new components build is now
# one sed over this file instead of twenty pins across seven package.json files.
#
# Nothing downstream sees `catalog:` — pnpm substitutes the concrete URL at pack/publish time,
# so the published @citolab/prose-qti manifest is byte-identical to what it was before this moved
# (verified by packing a test workspace). A consumer therefore does not need pnpm.
catalog:
  '@citolab/qti-components': 'https://pkg.pr.new/Citolab/qti-components/@citolab/qti-components@9910944'
  '@qti-components/base': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/base@9910944'
  '@qti-components/choice-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/choice-interaction@9910944'
  '@qti-components/extended-text-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/extended-text-interaction@9910944'
  '@qti-components/gap-match-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/gap-match-interaction@9910944'
  '@qti-components/hottext-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/hottext-interaction@9910944'
  '@qti-components/inline-choice-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/inline-choice-interaction@9910944'
  '@qti-components/interactions-core': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/interactions-core@9910944'
  '@qti-components/match-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/match-interaction@9910944'
  '@qti-components/order-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/order-interaction@9910944'
  '@qti-components/select-point-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/select-point-interaction@9910944'
  '@qti-components/text-entry-interaction': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/text-entry-interaction@9910944'
  '@qti-components/theme': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/theme@9910944'
  '@qti-components/transformers': 'https://pkg.pr.new/Citolab/qti-components/@qti-components/transformers@9910944'

# The cem CLI ships as a platform binary and needs its postinstall to run.
onlyBuiltDependencies:
  - "@pwrs/cem"
