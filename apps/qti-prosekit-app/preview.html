<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTI Item Preview</title>
    <!--
      The preview must look like the editor, and nothing else here makes it.

      This document loads @qti-components/theme's item.css and nothing more (see preview-entry.ts).
      The theme is spacing, sizing and paint by contract (qti-theme/CONTRACT.md) and deliberately
      declares no font-family, so a bare preview inherits the UA default — Times. The editor document
      is not styled by the theme alone: it also loads Tailwind, whose preflight puts the
      ui-sans-serif stack on `html`. That is the whole difference, and it made every preview render
      serif against a sans-serif editor.

      The stack is Tailwind's `--default-font-family` verbatim rather than a reference to it, because
      Tailwind is not loaded in this document and there is no token here to read.
    -->
    <style>
      html {
        font-family:
          ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji',
          'Segoe UI Symbol', 'Noto Color Emoji';
      }
    </style>
    <script type="module" src="./src/preview-entry.ts"></script>
  </head>
  <body style="margin:0;padding:0;">
    <div id="root"></div>
  </body>
</html>
